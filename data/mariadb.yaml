        dependencies:
          mariadb-connector-j:
            ranges:
              - '3.5'
            relationship: Java client driver
            confidence: high
            notes:
              - The MariaDB Connector/J 3.5 release line is compatible with all MariaDB Server versions.
            sources:
              - *mariadb_releases_source
              - *mariadb_connector_j_source
            lastVerified: '2026-07-31'
          mariadb-backup:
            ranges: []
            sameVersion: true
            relationship: physical backup tool
            confidence: high
            notes:
              - MariaDB recommends that MariaDB Backup exactly match the server version because mismatches can produce errors or unusable backups.
