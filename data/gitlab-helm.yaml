x-gitlab-19-requirements-source: &gitlab_19_requirements_source
  title: GitLab 19.3.2 tagged requirements
  url: https://gitlab.com/gitlab-org/gitlab/-/blob/v19.3.2-ee/doc/install/requirements.md
  accessedAt: '2026-09-11'

x-gitlab-19-pipeline-source: &gitlab_19_pipeline_source
  title: GitLab 19.3.2 tagged pipeline compatibility tests
  url: https://gitlab.com/gitlab-org/gitlab/-/blob/v19.3.2-ee/doc/development/pipelines/_index.md
  accessedAt: '2026-09-11'

projects:
  gitlab-helm:
    name: GitLab Helm Chart
    categories:
      - CI/CD
      - DevOps
      - Kubernetes
    website: https://docs.gitlab.com/charts/
    description: GitLab Helm chart compatibility for GitLab, external PostgreSQL, and Valkey versions.
    versions:
      '>=10.1 <10.4':
        dependencies:
          gitlab:
            ranges:
              - '>=19 <20'
            relationship: application
            confidence: high
            notes:
              - GitLab 19.x requirements map GitLab Helm chart 10.x to GitLab 19.x.
            sources:
              - *gitlab_19_requirements_source
            lastVerified: '2026-09-11'
          postgresql:
            ranges:
              - '>=17 <18'
            relationship: database
            confidence: high
            notes:
              - GitLab 19.x requirements map Helm chart 10.x to GitLab 19.x and list PostgreSQL 17.x as the only supported PostgreSQL major.
            sources:
              - *gitlab_19_requirements_source
            lastVerified: '2026-09-11'
          valkey:
            ranges:
              - '7.2'
            relationship: cache and background jobs
            confidence: high
            notes:
              - GitLab Helm chart 10.x maps to GitLab 19.x; GitLab 19.3.2 requirements and weekly compatibility pipelines document Valkey 7.2. No broader Valkey minor-version support is inferred.
            sources:
              - *gitlab_19_requirements_source
              - *gitlab_19_pipeline_source
            lastVerified: '2026-09-11'
