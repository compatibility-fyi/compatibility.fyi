projects:
  traefik-proxy:
    name: Traefik Proxy
    categories:
      - Reverse Proxy
      - Load Balancer
      - Kubernetes Gateway
    website: https://traefik.io/traefik
    description: Traefik Proxy compatibility with Kubernetes Gateway API specification releases.
    versions:
      '>=3.7.10 <3.8':
        dependencies:
          gateway-api:
            ranges:
              - '1.6.1'
            relationship: Kubernetes routing API
            confidence: high
            notes:
              - Traefik Proxy 3.7.10 introduces the documented Gateway API Standard version 1.6.1 support, retained in 3.7.11 and 3.7.12.
              - Earlier 3.7 patches document Gateway API 1.5.1 and are kept in a separate row.
            sources:
              - *traefik_3_7_10_gateway_source
              - *traefik_3_7_12_gateway_source
            lastVerified: '2026-09-04'
      '>=3.7.0 <3.7.10':
        dependencies:
          gateway-api:
            ranges:
              - '1.5.1'
            relationship: Kubernetes routing API
            confidence: high
            notes:
              - The Traefik Proxy 3.7.0 through 3.7.9 Kubernetes Gateway provider documents Gateway API Standard version 1.5.1.
              - Traefik documents full support for HTTPRoute core features and selected extended features, with TCPRoute support from the Experimental channel.
            sources:
              - *traefik_3_7_gateway_source
              - *traefik_3_7_9_gateway_source
            lastVerified: '2026-09-04'
      '3.6':
        dependencies:
          gateway-api:
            ranges:
              - '1.4.0'
            relationship: Kubernetes routing API
            confidence: high
            notes:
              - The Traefik Proxy 3.6 Kubernetes Gateway provider supports Gateway API Standard version 1.4.0.
              - Traefik documents full support for HTTPRoute core features and selected extended features, with TCPRoute and TLSRoute support from the Experimental channel.
            sources:
              - *traefik_3_6_gateway_source
            lastVerified: '2026-07-09'
