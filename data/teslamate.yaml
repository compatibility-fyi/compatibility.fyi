x-teslamate-401-requirements-source: &teslamate_401_requirements_source
  title: TeslaMate 4.0.1 development and distribution requirements
  url: https://github.com/teslamate-org/teslamate/blob/v4.0.1/website/docs/development.mdx
  accessedAt: '2026-07-31'

projects:
  teslamate:
    name: TeslaMate
    categories:
      - Automotive
      - Data Logging
      - Home Automation
    website: https://docs.teslamate.org/
    description: TeslaMate compatibility with external PostgreSQL database versions.
    versions:
      '4.0':
        dependencies:
          postgresql:
            ranges:
              - '>=18.0.0'
            relationship: database
            confidence: high
            notes:
              - TeslaMate 4.0.0 and 4.0.1 documentation both list PostgreSQL 18.0 or newer as an official requirement matching their distributed images.
              - Upstream states that TeslaMate generally aims to support the latest three PostgreSQL major releases.
            sources:
              - *teslamate_400_requirements_source
              - *teslamate_401_requirements_source
            lastVerified: '2026-07-31'
