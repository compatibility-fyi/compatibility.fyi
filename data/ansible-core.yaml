projects:
  ansible-core:
    name: Ansible Core
    categories:
      - Automation
      - Configuration Management
      - Python
    website: https://docs.ansible.com/projects/ansible-core/
    description: Ansible Core compatibility for control node Python, target node Python, and target node PowerShell versions.
    versions:
      '2.22':
        dependencies:
          python-control-node:
            ranges:
              - '>=3.13 <3.16'
            relationship: control node runtime
            confidence: high
            notes:
              - Ansible Core 2.22.0 tagged supported-version constants establish control node support for Python 3.13 through 3.15.
            sources:
              - *ansible_core_support_matrix_source
              - *ansible_core_222_source
            lastVerified: '2026-11-10'
          python-target-node:
            ranges:
              - '>=3.9 <3.16'
            relationship: target node runtime
            confidence: high
            notes:
              - Ansible Core 2.22.0 tagged supported-version constants establish target node support for Python 3.9 through 3.15.
            sources:
              - *ansible_core_support_matrix_source
              - *ansible_core_222_source
            lastVerified: '2026-11-10'
          powershell-target-node:
            ranges:
              - '5.1'
              - '7.6'
            relationship: target node runtime
            confidence: high
            notes:
              - Ansible Core 2.22 supports Windows PowerShell 5.1 and PowerShell 7.6 LTS on target nodes; the detailed PowerShell policy narrows the summary matrix’s 5.1–7 label to these release lines.
