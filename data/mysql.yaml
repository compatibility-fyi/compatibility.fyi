projects:
  mysql:
    name: MySQL
    categories:
      - Databases
      - Relational Database
    website: https://www.mysql.com/
    description: MySQL Server compatibility with official administration, routing, and client tools.
    versions:
      '26.10':
        dependencies:
          mysql-shell:
            ranges:
              - '26.10'
            relationship: administration client
            confidence: high
            notes:
              - MySQL Shell 26.10 supports MySQL Server 8.4, 9.7, and 26.10.
              - The single release policy replaces Shell 26.7 with 26.10 and supports all active MySQL Server release lines.
            sources:
              - *mysql_shell_2610_source
              - *mysql_2610_release_source
              - *mysql_lifecycle_source
            lastVerified: '2026-10-29'
          mysql-router:
            ranges:
              - '26.10'
            relationship: routing proxy
            confidence: high
            notes:
              - MySQL Router 26.10 officially supports MySQL Server 8.4, 9.7, and 26.10.
              - Upstream discontinued the separate Router 8.4 and 9.7 series when adopting the single release model.
            sources:
              - *mysql_router_2610_source
              - *mysql_single_release_source
            lastVerified: '2026-10-29'
          mysql-connector-j:
            ranges:
              - '26.10'
            relationship: Java client driver
            confidence: high
            notes:
              - MySQL Connector/J 26.10 supports MySQL Server 8.4 and newer and requires JRE 8 or newer.
            sources:
              - *mysql_connector_j_2610_source
              - *mysql_single_release_source
            lastVerified: '2026-10-29'
          mysql-connector-python:
            ranges:
              - '26.10'
            relationship: Python client driver
            confidence: high
            notes:
              - MySQL Connector/Python 26.10 supports MySQL Server 8.0 and newer according to the Connector/Python version reference.
