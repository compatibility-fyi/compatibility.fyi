projects:
  mysql:
    name: MySQL
    categories:
      - Databases
      - Relational Database
    website: https://www.mysql.com/
    description: MySQL Server compatibility with official administration, routing, and client tools.
    versions:
      '26.7':
        dependencies:
          mysql-shell:
            ranges:
              - '26.7'
            relationship: administration client
            confidence: high
            notes:
              - MySQL Shell 26.7 supports MySQL Server 8.4, 9.7, and 26.7.
              - Upstream discontinued Shell 8.4 and 9.7 when Shell adopted the single release model in 26.7.
            sources:
              - *mysql_shell_267_source
            lastVerified: '2026-09-11'
          mysql-router:
            ranges:
              - '26.7'
            relationship: routing proxy
            confidence: high
            notes:
              - MySQL Router 26.7 officially supports MySQL Server 8.4, 9.7, and 26.7.
              - Upstream discontinued the separate Router 8.4 and 9.7 series when adopting the single release model.
            sources:
              - *mysql_router_267_source
              - *mysql_single_release_source
            lastVerified: '2026-09-11'
          mysql-connector-j:
            ranges:
              - '26.7'
            relationship: Java client driver
            confidence: high
            notes:
              - MySQL Connector/J 26.7 supports MySQL Server 8.4 and newer and requires JRE 8 or newer.
            sources:
              - *mysql_connector_j_267_source
            lastVerified: '2026-09-11'
          mysql-connector-python:
            ranges:
              - '26.7'
            relationship: Python client driver
            confidence: high
            notes:
              - MySQL Connector/Python 26.7 retains support for MySQL Server 8.0 and newer; its release aligns the version with Server 26.7 without functional changes.
            sources:
              - *mysql_connector_python_267_source
              - *mysql_connector_python_source
            lastVerified: '2026-09-11'
