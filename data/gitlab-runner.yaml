    name: GitLab Runner
    category: CI/CD
    website: https://docs.gitlab.com/runner/
    description: GitLab Runner compatibility with GitLab coordinator versions.
    versions:
      '19.1':
        dependencies:
          gitlab:
            ranges:
              - '>=19.1 <19.2'
            relationship: coordinator
            confidence: high
            notes:
              - GitLab recommends keeping GitLab Runner major.minor in sync with the GitLab major.minor version.
