x-prometheus-operator-compatibility-source: &prometheus_operator_compatibility_source
  title: Prometheus Operator Compatibility
  url: https://prometheus-operator.dev/docs/getting-started/compatibility/
  accessedAt: '2026-07-08'

projects:
  prometheus-operator:
    name: Prometheus Operator
    categories:
      - Observability
      - Monitoring
      - Kubernetes Operator
    website: https://prometheus-operator.dev/
    description: Prometheus Operator compatibility for Kubernetes and managed monitoring components.
    versions:
      '0.84':
        dependencies:
          kubernetes:
            ranges:
              - '>=1.25.0'
            relationship: runtime
            confidence: high
            notes:
              - Prometheus Operator 0.84.0 and newer require Kubernetes 1.25.0 or newer because of CEL usage in CRDs.
            sources:
              - *prometheus_operator_compatibility_source
            lastVerified: '2026-07-08'
          prometheus:
            ranges:
              - '>=2.0.0'
            relationship: managed workload
            confidence: high
            notes:
              - Prometheus Operator supports Prometheus 2.0.0 and newer.
            sources:
              - *prometheus_operator_compatibility_source
            lastVerified: '2026-07-08'
          alertmanager:
            ranges:
              - '>=0.15.0'
            relationship: managed workload
            confidence: high
            notes:
              - Prometheus Operator supports Alertmanager 0.15 and newer.
            sources:
              - *prometheus_operator_compatibility_source
            lastVerified: '2026-07-08'
          thanos:
            ranges:
              - '>=0.10.0'
            relationship: managed workload
            confidence: high
            notes:
              - Prometheus Operator supports Thanos 0.10 and newer.
            sources:
              - *prometheus_operator_compatibility_source
            lastVerified: '2026-07-08'
      '0.83':
        dependencies:
          kubernetes:
            ranges:
              - '>=1.16.0'
            relationship: runtime
            confidence: high
            notes:
              - Prometheus Operator releases before 0.84.0 require Kubernetes 1.16.0 or newer.
