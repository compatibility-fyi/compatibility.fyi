              - '>=0.15.0'
            relationship: managed workload
            confidence: high
            notes:
              - Prometheus Operator supports Alertmanager 0.15 and newer.
            sources:
              - *prometheus_operator_compatibility_source
            lastVerified: '2026-07-08'
          thanos:
