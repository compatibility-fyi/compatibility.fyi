      '0.94':
        dependencies:
          kubernetes:
            ranges:
              - '>=1.25.0'
            relationship: runtime
            confidence: high
            notes:
              - Prometheus Operator 0.94 requires Kubernetes 1.25.0 or newer because of CEL validation in CRDs.
