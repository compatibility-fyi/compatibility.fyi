projects:
  harvester:
    name: Harvester
    categories:
      - Virtualization
      - Hyperconverged Infrastructure
      - Kubernetes
    website: https://harvesterhci.io/
    description: Harvester compatibility for Rancher integration, guest clusters and operating systems, external drivers, Terraform, and upgrade sources.
    versions:
      1.8.2:
        dependencies:
          rancher:
            ranges:
              - '>=2.14 <2.15'
            relationship: management integration
            confidence: high
            notes:
              - The Harvester 1.8 support matrix pairs Harvester 1.8 with Rancher 2.14.
            sources:
              - *harvester_18_source
            lastVerified: '2026-09-11'
          rke2:
            ranges:
              - '>=1.33 <1.35'
              - '>=1.35.4 <1.36'
            relationship: Harvester node-driver guest cluster
            confidence: high
            notes:
              - The node driver supports RKE2 1.33 through 1.35, but the source documents a known issue for RKE2 1.35 through 1.35.3, so those patches are excluded.
            sources:
              - *harvester_18_source
            lastVerified: '2026-09-11'
          harvester-cloud-provider:
            ranges:
              - '0.2.11'
            relationship: supported guest cluster cloud provider
            confidence: high
            notes:
              - The support matrix lists Harvester Cloud Provider 0.2.11 with feature-upgrade support for the documented RKE2 patch levels.
            sources:
              - *harvester_18_source
            lastVerified: '2026-09-11'
          harvester-csi-driver:
            ranges:
              - '>=0.1.28'
            relationship: supported guest cluster storage driver
            confidence: high
            notes:
              - The support matrix lists Harvester CSI Driver 0.1.28 and later paired with Cloud Provider 0.2.11; see rke2-ccm-csi for required RKE2 patches.
            sources:
              - *harvester_18_source
            lastVerified: '2026-09-11'
          harvester-ui-extension:
            ranges:
              - '1.8.0'
              - '1.8.1'
              - '1.8.2'
            relationship: Rancher UI integration
            confidence: high
            notes:
              - The support matrix lists Harvester UI Extension 1.8.0 through 1.8.2 for Rancher 2.14.0 and later.
            sources:
              - *harvester_18_source
            lastVerified: '2026-09-11'
          terraform-provider-harvester:
            ranges:
              - 1.8.2
            relationship: infrastructure provider
            confidence: high
            notes:
              - The support matrix certifies Harvester 1.8.2 with Terraform Provider 1.8.2.
            sources:
              - *harvester_18_source
            lastVerified: '2026-09-11'
          harvester-upgrade-source:
            ranges:
              - '1.7'
            relationship: supported prior-minor upgrade source
            confidence: high
            notes:
              - The support matrix documents upgrades from Harvester 1.7 to 1.8; same-line patch upgrades are directional and therefore are not modeled as a broad range.
            sources:
              - *harvester_18_source
            lastVerified: '2026-09-11'
