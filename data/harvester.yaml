            relationship: validated virtual machine guest operating system
            confidence: high
            notes:
              - The support matrix lists RHEL 9 and 10 as validated guest operating systems.
            sources:
              - *harvester_18_source
            lastVerified: '2026-07-10'
          windows-server:
            ranges:
              - '2025'
            relationship: validated virtual machine guest operating system
            confidence: high
            notes:
              - The support matrix lists Windows Server 2025 as a validated guest operating system.
            sources:
              - *harvester_18_source
            lastVerified: '2026-07-10'
          windows:
