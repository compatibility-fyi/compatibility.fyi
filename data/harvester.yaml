projects:
  harvester:
    name: Harvester
    categories:
      - Virtualization
      - Hyperconverged Infrastructure
      - Kubernetes
    website: https://harvesterhci.io/
    description: Harvester compatibility for Rancher, Kubernetes, bundled infrastructure components, upgrade sources, and validated guest operating systems.
    versions:
      '1.8':
        dependencies:
          rancher:
            ranges:
              - '>=2.14 <2.15'
            relationship: management integration
            confidence: high
            notes:
              - The Harvester 1.8 support matrix pairs Harvester 1.8 with Rancher 2.14.
            sources:
              - *harvester_18_source
            lastVerified: '2026-07-10'
          rke2:
            ranges:
              - '>=1.33 <1.35'
              - '>=1.35.4 <1.36'
            relationship: Harvester node-driver guest cluster
            confidence: high
            notes:
              - The node driver supports RKE2 1.33 through 1.35, but the source documents a known issue for RKE2 1.35 through 1.35.3, so those patches are excluded.
            sources:
              - *harvester_18_source
            lastVerified: '2026-07-10'
          embedded-rke2:
            ranges:
              - '1.35'
            relationship: bundled Kubernetes runtime
            confidence: high
            notes:
              - The SUSE Virtualization component table maps the 1.8 line to embedded RKE2 1.35.
            sources:
              - *harvester_components_source
            lastVerified: '2026-07-10'
          kubevirt:
            ranges:
              - '1.7'
            relationship: bundled virtualization runtime
            confidence: high
            notes:
              - The SUSE Virtualization component table maps the 1.8 line to KubeVirt 1.7.
            sources:
              - *harvester_components_source
            lastVerified: '2026-07-10'
          longhorn:
            ranges:
              - '1.11'
            relationship: bundled storage runtime
            confidence: high
            notes:
              - The SUSE Virtualization component table maps the 1.8 line to SUSE Storage, based on Longhorn, 1.11.
            sources:
              - *harvester_components_source
            lastVerified: '2026-07-10'
          sle-micro:
            ranges:
              - '6.2'
            relationship: bundled host operating system
            confidence: high
            notes:
              - The SUSE Virtualization component table maps the 1.8 line to SLE Micro 6.2.
            sources:
              - *harvester_components_source
            lastVerified: '2026-07-10'
          harvester-cloud-provider:
            ranges:
              - '0.2.11'
            relationship: supported guest cluster cloud provider
            confidence: high
            notes:
              - The support matrix lists Harvester Cloud Provider 0.2.11 with feature-upgrade support for the documented RKE2 patch levels.
            sources:
              - *harvester_18_source
            lastVerified: '2026-07-10'
          harvester-csi-driver:
            ranges:
              - '>=0.1.28'
            relationship: supported guest cluster storage driver
            confidence: high
            notes:
              - The support matrix lists Harvester CSI Driver 0.1.28 and later in the 0.1 line with Cloud Provider 0.2.11 for the documented RKE2 patch levels.
            sources:
              - *harvester_18_source
            lastVerified: '2026-07-10'
          harvester-ui-extension:
            ranges:
              - '1.8.0'
              - '1.8.1'
            relationship: Rancher UI integration
            confidence: high
            notes:
              - The support matrix lists Harvester UI Extension 1.8.0 and 1.8.1 for Rancher 2.14.0 and later.
            sources:
              - *harvester_18_source
            lastVerified: '2026-07-10'
          ui-plugin-catalog:
            ranges:
              - '4.23.0'
              - '4.30.0'
            relationship: Harvester UI extension asset image
            confidence: high
            notes:
              - UI extension 1.8.0 uses ui-plugin-catalog 4.23.0 and extension 1.8.1 uses 4.30.0.
            sources:
              - *harvester_18_source
            lastVerified: '2026-07-10'
          terraform-provider-harvester:
            ranges:
              - '>=1.8 <1.9'
            relationship: infrastructure provider
            confidence: high
            notes:
              - The support matrix maps Harvester 1.8.0 and 1.8.1 to matching Terraform provider versions.
            sources:
              - *harvester_18_source
            lastVerified: '2026-07-10'
          harvester-upgrade-source:
            ranges:
              - '1.7'
            relationship: supported prior-minor upgrade source
            confidence: high
            notes:
              - The support matrix documents upgrades from Harvester 1.7 to 1.8; same-line patch upgrades are directional and therefore are not modeled as a broad range.
            sources:
              - *harvester_18_source
            lastVerified: '2026-07-10'
          sles:
            ranges:
              - 15 SP7
              - '16'
            relationship: validated virtual machine guest operating system
            confidence: high
            notes:
              - The support matrix lists SLES 15 SP7 and 16 as validated guest operating systems.
            sources:
              - *harvester_18_source
            lastVerified: '2026-07-10'
          sle-micro-guest:
            ranges:
              - '6.1'
              - '6.2'
            relationship: validated virtual machine guest operating system
            confidence: high
            notes:
              - The support matrix lists SLE Micro 6.1 and 6.2 as validated guest operating systems.
            sources:
              - *harvester_18_source
            lastVerified: '2026-07-10'
          ubuntu:
            ranges:
              - '22.04'
              - '24.04'
            relationship: validated virtual machine guest operating system
            confidence: high
            notes:
              - The support matrix lists Ubuntu 22.04 and 24.04 as validated guest operating systems.
            sources:
              - *harvester_18_source
            lastVerified: '2026-07-10'
          rhel:
