projects:
  ansible:
    name: Ansible
    categories:
      - Automation
      - Configuration Management
      - Python
    website: https://docs.ansible.com/projects/ansible/
    description: Ansible community package compatibility for its ansible-core dependency.
    versions:
      '14':
        dependencies:
          ansible-core:
            ranges:
              - '>=2.21 <2.22'
            relationship: core dependency
            confidence: high
            notes:
              - Ansible 14 build metadata specifies ansible-core 2.21, and the released Ansible 14.4.0 dependency manifest pins ansible-core 2.21.4.
            sources:
              - title: Ansible 14 build constraints at 14.4.0
                url: https://github.com/ansible-community/ansible-build-data/blob/14.4.0/14/ansible-14.build
                accessedAt: 2026-09-11
              - title: Ansible 14.4.0 dependency manifest
                url: https://github.com/ansible-community/ansible-build-data/blob/14.4.0/14/ansible-14.4.0.deps
                accessedAt: 2026-09-11
            lastVerified: '2026-09-11'
