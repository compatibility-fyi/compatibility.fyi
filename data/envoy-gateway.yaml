x-envoy-gateway-matrix-source: &envoy_gateway_matrix_source
  title: Envoy Gateway Compatibility Matrix
  url: https://gateway.envoyproxy.io/news/releases/matrix/
  accessedAt: '2026-11-10'

projects:
  envoy-gateway:
    name: Envoy Gateway
    categories:
      - Networking
      - Gateway API
      - Kubernetes
    website: https://gateway.envoyproxy.io/
    versions:
      '1.10':
        dependencies:
          envoy-proxy:
            ranges:
              - '1.40'
            relationship: independently selected data plane
            confidence: high
            notes:
              - Envoy Gateway v1.10 lists the Envoy Proxy 1.40.x release series in the official compatibility matrix; each gateway release is tested against that Envoy minor version.
              - The EnvoyProxy image setting allows independent selection. The matrix tests the listed minor version; other Envoy minor versions are untested and may reject generated configuration.
            sources:
              - *envoy_gateway_matrix_source
            lastVerified: '2026-11-10'
            basis: tested
          gateway-api:
            ranges:
              - 1.6.1
            relationship: supported Gateway API version
            confidence: high
            notes:
              - Envoy Gateway v1.10 lists Gateway API v1.6.1 in the official compatibility matrix.
            sources:
              - *envoy_gateway_matrix_source
            lastVerified: '2026-11-10'
          gateway-api-standard:
            ranges:
              - 1.6.1
            relationship: supported Standard-channel Gateway API version
            confidence: high
            notes:
              - Applies only to Gateway API Standard-channel CRDs installed from standard-install.yaml; Experimental-channel CRDs and fields are excluded.
              - Envoy Gateway v1.10 lists Gateway API v1.6.1 in its official compatibility matrix.
              - Gateway API's general Standard-channel compatibility contract does not establish Envoy Gateway support for additional bundle versions. Unlisted versions remain unknown.
            sources:
              - *envoy_gateway_matrix_source
              - title: Gateway API v1.6.2 implementer's guide - Standard-channel compatibility and version-specific conformance
                url: https://github.com/kubernetes-sigs/gateway-api/blob/v1.6.2/site/content/en/guides/implementers-guide/_index.md
                accessedAt: '2026-11-10'
              - title: Envoy Gateway v1.10.0 installation guide - Standard-channel Gateway API CRDs
                url: https://github.com/envoyproxy/gateway/blob/v1.10.0/site/content/en/latest/install/install-helm.md
                accessedAt: 2026-11-10
            lastVerified: '2026-11-10'
          kubernetes:
            ranges:
              - '>=1.34 <1.38'
            relationship: runtime
            confidence: high
            notes:
              - Envoy Gateway v1.10 lists Kubernetes v1.34, v1.35, v1.36, and v1.37 in the official compatibility matrix.
            sources:
              - *envoy_gateway_matrix_source
            lastVerified: '2026-11-10'
            basis: tested
      '1.9':
        dependencies:
          envoy-proxy:
            ranges:
              - '1.39'
            relationship: independently selected data plane
            confidence: high
            notes:
              - Envoy Gateway v1.9 lists the Envoy Proxy 1.39.x release series in the official compatibility matrix; each gateway release is tested against that Envoy minor version.
              - The EnvoyProxy image setting allows independent selection. The matrix tests the listed minor version; other Envoy minor versions are untested and may reject generated configuration.
            sources:
              - *envoy_gateway_matrix_source
            lastVerified: '2026-11-10'
            basis: tested
          gateway-api:
            ranges:
              - 1.6.1
            relationship: supported Gateway API version
            confidence: high
            notes:
              - Envoy Gateway v1.9 lists Gateway API v1.6.1 in the official compatibility matrix.
            sources:
              - *envoy_gateway_matrix_source
            lastVerified: '2026-11-10'
          gateway-api-standard:
            ranges:
              - 1.6.1
            relationship: supported Standard-channel Gateway API version
            confidence: high
            notes:
              - Applies only to Gateway API Standard-channel CRDs installed from standard-install.yaml; Experimental-channel CRDs and fields are excluded.
              - Envoy Gateway v1.9 lists Gateway API v1.6.1 in its official compatibility matrix.
              - Gateway API's general Standard-channel compatibility contract does not establish Envoy Gateway support for additional bundle versions. Unlisted versions remain unknown.
            sources:
              - *envoy_gateway_matrix_source
              - title: Gateway API v1.6.2 implementer's guide - Standard-channel compatibility and version-specific conformance
                url: https://github.com/kubernetes-sigs/gateway-api/blob/v1.6.2/site/content/en/guides/implementers-guide/_index.md
                accessedAt: '2026-11-10'
            lastVerified: '2026-11-10'
          kubernetes:
            ranges:
              - '>=1.33 <1.37'
            relationship: runtime
            confidence: high
            notes:
              - Envoy Gateway v1.9 lists Kubernetes v1.33, v1.34, v1.35, and v1.36 in the official compatibility matrix.
            sources:
              - *envoy_gateway_matrix_source
            lastVerified: '2026-11-10'
            basis: tested
    description: Envoy Gateway compatibility for independently selected Envoy data planes, Gateway API versions, and tested Kubernetes versions.
