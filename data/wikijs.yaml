projects:
  wikijs:
    name: Wiki.js
    categories:
      - Knowledge Management
      - Collaboration
      - Node.js
    website: https://js.wiki/
    description: Wiki.js compatibility for the Node.js runtime and supported database engines.
    versions:
      '3.3 || 3.2 || 3.1 || >=3.0.1 <3.1':
        dependencies:
          nodejs:
            ranges:
              - '26'
            relationship: runtime
            confidence: high
            notes:
              - Wiki.js 3 server requirements support Node.js 26; earlier Node.js versions are explicitly incompatible.
              - Tagged backend packages for 3.0.1, 3.1.0, 3.2.0, and 3.3.0 require Node.js 26.0 or later; the documented supported release line is used here.
            sources:
              - *wikijs_3_requirements_source
              - *wikijs_3_release_source
              - title: Wiki.js 3.3.0 backend runtime requirement
                url: https://github.com/requarks/wiki/blob/3.3.0/backend/package.json
                accessedAt: '2026-11-10'
              - title: Wiki.js 3.2.0 backend runtime requirement
                url: https://github.com/requarks/wiki/blob/3.2.0/backend/package.json
                accessedAt: '2026-11-10'
              - title: Wiki.js 3.1.0 backend runtime requirement
                url: https://github.com/requarks/wiki/blob/3.1.0/backend/package.json
                accessedAt: '2026-11-10'
              - title: Wiki.js 3.0.1 backend runtime requirement
                url: https://github.com/requarks/wiki/blob/3.0.1/backend/package.json
                accessedAt: '2026-11-10'
            lastVerified: '2026-11-10'
          postgresql:
            ranges:
              - '>=17 <19'
            relationship: database
            confidence: high
            notes:
              - Wiki.js 3 server requirements support PostgreSQL 17 and 18; the ltree and pg_trgm extensions must be available.
              - Tagged sample configurations for 3.0, 3.1, 3.2, and 3.3 require PostgreSQL 17 or later. Other database engines supported by Wiki.js 2 are not carried forward to Wiki.js 3.
            sources:
              - *wikijs_3_requirements_source
              - *wikijs_330_database_source
              - title: Wiki.js 3.2.0 sample configuration PostgreSQL requirement
                url: https://github.com/requarks/wiki/blob/3.2.0/config.sample.yml
                accessedAt: '2026-11-10'
              - title: Wiki.js 3.1.0 sample configuration PostgreSQL requirement
                url: https://github.com/requarks/wiki/blob/3.1.0/config.sample.yml
                accessedAt: '2026-11-10'
              - title: Wiki.js 3.0.1 sample configuration PostgreSQL requirement
                url: https://github.com/requarks/wiki/blob/3.0.1/config.sample.yml
                accessedAt: '2026-11-10'
            lastVerified: '2026-11-10'
      '2.5.302 - 2.5.315':
        dependencies:
          nodejs:
            ranges:
              - '>=22 <23'
              - '>=24 <25'
            relationship: runtime
            confidence: high
            notes:
              - Wiki.js server requirements list Node.js 22.0 or later in the 22.x line and Node.js 24.0 or later in the 24.x line, supported since Wiki.js 2.5.302.
            sources:
              - *wikijs_requirements_source
            lastVerified: '2026-11-10'
          postgresql:
            ranges:
              - '>=9.5'
            relationship: database
            confidence: high
            notes:
              - Wiki.js sample configurations for 2.5.302 and 2.5.315 list PostgreSQL 9.5 or later as a supported database engine.
              - Wiki.js recommends PostgreSQL for the best performance, features, and future compatibility.
            sources:
              - *wikijs_25302_database_source
              - *wikijs_25315_database_source
              - *wikijs_requirements_source
            lastVerified: '2026-11-10'
          mysql:
            ranges:
              - '>=8.0'
            relationship: database
            confidence: high
            notes:
              - Wiki.js sample configurations for 2.5.302 and 2.5.315 list MySQL 8.0 or later as supported.
              - MySQL 5.7.8 is documented as only partially supported and is intentionally not represented as a compatible range.
            sources:
              - *wikijs_25302_database_source
              - *wikijs_25315_database_source
              - *wikijs_requirements_source
            lastVerified: '2026-11-10'
          mariadb:
            ranges:
              - '>=10.2.7'
            relationship: database
            confidence: high
            notes:
              - Wiki.js sample configurations for 2.5.302 and 2.5.315 list MariaDB 10.2.7 or later as a supported database engine.
            sources:
              - *wikijs_25302_database_source
              - *wikijs_25315_database_source
            lastVerified: '2026-11-10'
          microsoft-sql-server:
            ranges:
              - '>=2012'
            relationship: database
            confidence: high
            notes:
              - Wiki.js sample configurations for 2.5.302 and 2.5.315 list Microsoft SQL Server 2012 or later as a supported database engine.
            sources:
              - *wikijs_25302_database_source
              - *wikijs_25315_database_source
            lastVerified: '2026-11-10'
          sqlite:
            ranges:
              - '>=3.9'
            relationship: database
            confidence: high
            notes:
              - Wiki.js sample configurations for 2.5.302 and 2.5.315 list SQLite 3.9 or later as a supported database engine.
              - Wiki.js does not recommend SQLite for production deployments.
            sources:
              - *wikijs_25302_database_source
              - *wikijs_25315_database_source
              - *wikijs_requirements_source
            lastVerified: '2026-11-10'
