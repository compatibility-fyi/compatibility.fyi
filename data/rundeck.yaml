projects:
  rundeck:
    name: Rundeck
    categories:
      - Automation
      - Runbook Automation
      - Operations
      - Java
    website: https://www.rundeck.com/open-source
    description: Rundeck Open Source compatibility for Java runtimes and recommended production database backends.
    versions:
      '6.2':
        dependencies:
          java:
            ranges:
              - '>=17 <=25'
            relationship: runtime
            confidence: high
            notes:
              - Rundeck 6.2 system requirements set Java 17 as the minimum supported production runtime with support through Java 25.
              - Rundeck docs recommend Azul Zulu OpenJDK as the Java distribution used for builds and testing.
            sources:
              - *rundeck_62_system_requirements_source
            lastVerified: '2026-09-11'
          mariadb:
            ranges:
              - '>=10.11.6'
            relationship: database
            confidence: high
            notes:
              - Rundeck system requirements list MariaDB 10.11.6 or newer as a recommended production database backend for Rundeck Open Source.
            sources:
              - *rundeck_62_system_requirements_source
            lastVerified: '2026-09-11'
          mysql:
            ranges:
              - '>=8.0.35 <8.1'
              - '>=8.4'
            relationship: database
            confidence: high
            notes:
              - Rundeck system requirements list MySQL 8.0.35 or newer and MySQL 8.4 or newer as recommended production database backends for Rundeck Open Source.
              - Rundeck MySQL backend documentation states that MySQL 8.4 is supported as of Rundeck 6.0.0.
              - Rundeck MySQL backend documentation recommends MySQL 8.0.35 or newer for the MySQL 8.0 line.
            sources:
              - *rundeck_62_system_requirements_source
              - *rundeck_mysql_source
            lastVerified: '2026-09-11'
          postgresql:
            ranges:
              - '>=15.5'
            relationship: database
            confidence: high
            notes:
              - Rundeck system requirements list PostgreSQL 15.5 or newer as a recommended production database backend for Rundeck Open Source.
              - Rundeck PostgreSQL backend documentation notes that EnterpriseDB is not supported even though it is based on PostgreSQL.
            sources:
              - *rundeck_62_system_requirements_source
              - *rundeck_postgres_source
            lastVerified: '2026-09-11'
          microsoft-sql-server:
            ranges:
              - '>=2022 <2023'
            relationship: database
            confidence: high
            notes:
              - Rundeck system requirements list Microsoft SQL Server 2022 as a recommended production database backend for Rundeck Open Source.
            sources:
              - *rundeck_62_system_requirements_source
            lastVerified: '2026-09-11'
          oracle:
            ranges:
              - '>=19'
              - '19c'
            relationship: database
            confidence: high
            notes:
              - Rundeck system requirements list Oracle 19c or newer as a recommended production database backend for Rundeck Open Source.
            sources:
              - *rundeck_62_system_requirements_source
            lastVerified: '2026-09-11'
