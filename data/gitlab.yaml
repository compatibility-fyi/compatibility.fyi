x-gitlab-19-requirements-source: &gitlab_19_requirements_source
  title: GitLab 19.3.2 tagged requirements
  url: https://gitlab.com/gitlab-org/gitlab/-/blob/v19.3.2-ee/doc/install/requirements.md
  accessedAt: '2026-09-11'

x-gitlab-19-pipeline-source: &gitlab_19_pipeline_source
  title: GitLab 19.3.2 tagged pipeline compatibility tests
  url: https://gitlab.com/gitlab-org/gitlab/-/blob/v19.3.2-ee/doc/development/pipelines/_index.md
  accessedAt: '2026-09-11'

projects:
  gitlab:
    name: GitLab
    categories:
      - CI/CD
      - DevOps
      - Source Control
    website: https://about.gitlab.com/
    description: GitLab self-managed compatibility for PostgreSQL, Redis, Valkey, and the GitLab Helm chart.
    versions:
      '19.3':
        dependencies:
          postgresql:
            ranges:
              - '>=17 <18'
            relationship: database
            confidence: high
            notes:
              - GitLab 19.x requirements list PostgreSQL 17.x as both the minimum and maximum supported PostgreSQL version.
            sources:
              - *gitlab_19_requirements_source
            lastVerified: '2026-09-11'
          redis:
            ranges:
              - '>=7 <8'
            relationship: cache and background jobs
            confidence: high
            notes:
              - GitLab 19.x requirements recommend Redis 7.2 and require Redis 7.0 or newer.
            sources:
              - *gitlab_19_requirements_source
            lastVerified: '2026-09-11'
          valkey:
            ranges:
              - '7.2'
            relationship: cache and background jobs
            confidence: high
            notes:
              - GitLab 19.3.2 requirements specify Valkey 7.2 as the recommended and minimum version, and weekly pipelines test the 7.2 release line. No broader Valkey minor-version support is inferred.
            sources:
              - *gitlab_19_requirements_source
              - *gitlab_19_pipeline_source
            lastVerified: '2026-09-11'
          gitlab-helm:
            ranges:
              - '>=10 <11'
            relationship: deployment chart
            confidence: high
            notes:
              - GitLab 19.x requirements map GitLab 19.x to GitLab Helm chart 10.x.
            sources:
              - *gitlab_19_requirements_source
            lastVerified: '2026-09-11'
          postgresql-linux-package-fresh-install:
            ranges:
              - '>=17 <18'
              - '18.4'
            relationship: Linux package fresh-install database
            confidence: high
            notes:
              - GitLab 19.3 introduces PostgreSQL 18.4 as an opt-in option for fresh Linux-package installations, alongside the supported PostgreSQL 17 line.
              - Upgrading an existing installation to PostgreSQL 18.4 is explicitly not supported; this entry does not apply to the Helm chart or general external-database installations.
            sources:
              - title: GitLab 19.3 release notes - PostgreSQL 18.4 for fresh Linux-package installs
                url: https://docs.gitlab.com/releases/19/gitlab-19-3-released/
                accessedAt: 2026-09-11
              - title: PostgreSQL versions shipped with the GitLab Linux package
                url: https://docs.gitlab.com/administration/package_information/postgresql_versions/
                accessedAt: 2026-09-11
            lastVerified: 2026-09-11
      '>=19.1 <19.3':
        dependencies:
          postgresql:
            ranges:
              - '>=17 <18'
            relationship: database
            confidence: high
            notes:
              - GitLab 19.x requirements list PostgreSQL 17.x as both the minimum and maximum supported PostgreSQL version.
            sources:
              - *gitlab_19_requirements_source
            lastVerified: '2026-09-11'
          redis:
            ranges:
              - '>=7 <8'
            relationship: cache and background jobs
            confidence: high
            notes:
              - GitLab 19.x requirements recommend Redis 7.2 and require Redis 7.0 or newer.
            sources:
              - *gitlab_19_requirements_source
            lastVerified: '2026-09-11'
          valkey:
            ranges:
              - '7.2'
            relationship: cache and background jobs
            confidence: high
            notes:
              - GitLab 19.3.2 requirements specify Valkey 7.2 as the recommended and minimum version, and weekly pipelines test the 7.2 release line. No broader Valkey minor-version support is inferred.
            sources:
              - *gitlab_19_requirements_source
              - *gitlab_19_pipeline_source
            lastVerified: '2026-09-11'
          gitlab-helm:
            ranges:
              - '>=10 <11'
            relationship: deployment chart
            confidence: high
            notes:
              - GitLab 19.x requirements map GitLab 19.x to GitLab Helm chart 10.x.
            sources:
              - *gitlab_19_requirements_source
            lastVerified: '2026-09-11'
