x-gitlab-19-requirements-source: &gitlab_19_requirements_source
  title: GitLab 19.1 tagged requirements
  url: https://gitlab.com/gitlab-org/gitlab/-/blob/v19.1.0-ee/doc/install/requirements.md
  accessedAt: '2026-07-09'

x-gitlab-18-requirements-source: &gitlab_18_requirements_source
  title: GitLab 18.11 tagged requirements
  url: https://gitlab.com/gitlab-org/gitlab/-/blob/v18.11.0-ee/doc/install/requirements.md
  accessedAt: '2026-07-09'

x-gitlab-17-requirements-source: &gitlab_17_requirements_source
  title: GitLab 17.11 tagged requirements
  url: https://gitlab.com/gitlab-org/gitlab/-/blob/v17.11.0-ee/doc/install/requirements.md
  accessedAt: '2026-07-09'

projects:
  gitlab:
    name: GitLab
    category: CI/CD
    website: https://about.gitlab.com/
    description: GitLab self-managed compatibility for PostgreSQL, Redis, Valkey, and the GitLab Helm chart.
    versions:
      '19':
        dependencies:
          postgresql:
            ranges:
              - '>=17 <18'
            relationship: database
            confidence: high
            notes:
              - GitLab 19.x requirements list PostgreSQL 17.x as both the minimum and maximum supported PostgreSQL version.
            sources:
              - *gitlab_19_requirements_source
            lastVerified: '2026-07-09'
          redis:
            ranges:
              - '>=7.2 <8'
            relationship: cache and background jobs
            confidence: high
            notes:
              - GitLab 19.x requirements state that Redis 7.2 is required.
            sources:
              - *gitlab_19_requirements_source
            lastVerified: '2026-07-09'
          valkey:
            ranges:
              - '>=7.2 <8'
            relationship: cache and background jobs
            confidence: high
            notes:
              - GitLab 19.x requirements state that Valkey 7.2 is supported as an alternative to Redis 7.2.
            sources:
              - *gitlab_19_requirements_source
            lastVerified: '2026-07-09'
          gitlab-helm:
            ranges:
              - '>=10 <11'
            relationship: deployment chart
            confidence: high
            notes:
              - GitLab 19.x requirements map GitLab 19.x to GitLab Helm chart 10.x.
            sources:
              - *gitlab_19_requirements_source
            lastVerified: '2026-07-09'
      '18':
        dependencies:
          postgresql:
            ranges:
              - '>=16.5 <18'
            relationship: database
            confidence: high
            notes:
              - GitLab 18.x requirements list PostgreSQL 16.5 as the minimum and PostgreSQL 17.x as the maximum supported PostgreSQL version.
            sources:
              - *gitlab_18_requirements_source
            lastVerified: '2026-07-09'
          redis:
            ranges:
              - '>=6 <8'
            relationship: cache and background jobs
            confidence: high
            notes:
              - GitLab 18.11 requirements state that Redis 6.x or 7.x is required.
            sources:
              - *gitlab_18_requirements_source
            lastVerified: '2026-07-09'
          gitlab-helm:
            ranges:
              - '>=9 <10'
            relationship: deployment chart
            confidence: high
            notes:
              - GitLab 18.x requirements map GitLab 18.x to GitLab Helm chart 9.x.
            sources:
              - *gitlab_18_requirements_source
            lastVerified: '2026-07-09'
      '17':
        dependencies:
          postgresql:
            ranges:
              - '>=14 <17'
            relationship: database
            confidence: high
            notes:
              - GitLab 17.11 requirements list PostgreSQL 14.x as the minimum and PostgreSQL 16.x as the maximum supported PostgreSQL version.
            sources:
              - *gitlab_17_requirements_source
            lastVerified: '2026-07-09'
          redis:
            ranges:
              - '>=6.2 <8'
            relationship: cache and background jobs
            confidence: high
            notes:
              - GitLab 17.11 requirements state that Redis 6.2.x or 7.x is required.
            sources:
              - *gitlab_17_requirements_source
            lastVerified: '2026-07-09'
          gitlab-helm:
            ranges:
              - '>=8 <9'
            relationship: deployment chart
            confidence: high
            notes:
              - GitLab 18.11 requirements map GitLab 17.x to GitLab Helm chart 8.x.
            sources:
              - *gitlab_18_requirements_source
            lastVerified: '2026-07-09'
