x-helm-version-skew-source: &helm_version_skew_source
  title: Helm Version Support Policy
  url: https://helm.sh/docs/topics/version_skew/
  accessedAt: '2026-09-11'

projects:
  helm:
    name: Helm
    categories:
      - Packaging
      - Kubernetes
    website: https://helm.sh/
    description: Kubernetes package manager compatibility for Kubernetes API server versions.
    versions:
      '4.3':
        dependencies:
          kubernetes:
            ranges:
              - '>=1.34 <1.38'
            relationship: runtime
            confidence: high
            notes:
              - Helm version support policy lists Helm 4.3.x as supporting Kubernetes 1.37.x through 1.34.x.
            sources:
              - *helm_version_skew_source
              - title: Helm v4.3.0 release
                url: https://github.com/helm/helm/releases/tag/v4.3.0
                accessedAt: 2026-09-11
            lastVerified: '2026-09-11'
