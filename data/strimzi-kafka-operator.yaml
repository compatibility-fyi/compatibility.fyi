projects:
  strimzi-kafka-operator:
    name: Strimzi Kafka Operator
    categories:
      - Messaging
      - Kafka
      - Kubernetes Operator
    website: https://strimzi.io/
    description: Kubernetes operator compatibility for Apache Kafka and Kubernetes versions.
    versions:
      '1.2.0':
        dependencies:
          apache-kafka:
            ranges:
              - '4.2.0'
              - '4.2.1'
              - '4.3.0'
              - '4.3.1'
            relationship: managed Kafka cluster
            confidence: high
            notes:
              - Strimzi 1.2.0 marks Apache Kafka 4.2.0, 4.2.1, 4.3.0, and 4.3.1 as supported.
              - Apache Kafka 4.3.1 is the default version for this Strimzi release.
            sources:
              - *strimzi_1_2_kafka_source
            lastVerified: '2026-08-25'
          kubernetes:
            ranges:
              - '>=1.30'
            relationship: runtime
            confidence: high
            notes:
              - Strimzi 1.2.0 documentation requires Kubernetes 1.30 or later.
            sources:
              - *strimzi_1_2_platform_source
            lastVerified: '2026-08-25'
