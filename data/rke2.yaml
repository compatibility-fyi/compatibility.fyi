projects:
  rke2:
    name: RKE2
    categories:
      - Kubernetes
      - Kubernetes Distribution
      - Container Runtime
    website: https://docs.rke2.io/
    description: RKE2 compatibility for host operating systems, architectures, network plugin choices, cloud integrations, and Windows workers.
    versions:
      1.37.0+rke2r1:
        dependencies:
          architecture:
            ranges:
              - x86_64
              - arm64
            relationship: supported architecture
            confidence: high
            notes:
              - The upstream requirements list x86_64 and arm64/aarch64; this release provides Linux binaries for both architectures.
              - A SUSE 1.37 certification matrix was not available when verified, so earlier operating-system and cloud-integration certifications are not inherited.
            sources:
              - &rke2_upstream_requirements_source
                title: RKE2 Installation Requirements - Architecture and Windows
                url: https://docs.rke2.io/install/requirements
                accessedAt: 2026-09-16
              - &rke2_137_release_source
                title: RKE2 v1.37.0+rke2r1 release - Available CNIs and release assets
                url: https://github.com/rancher/rke2/releases/tag/v1.37.0%2Brke2r1
                accessedAt: 2026-09-16
            lastVerified: 2026-09-16
          cni:
            ranges:
              - canal
              - calico
              - cilium
              - multus
            relationship: available network plugin
            confidence: high
            notes:
              - The release notes list Canal, Calico, Cilium, and Multus as available CNI choices.
            sources:
              - *rke2_137_release_source
            lastVerified: 2026-09-16
          windows-server:
            ranges:
              - '2022'
            relationship: tested Windows worker operating system
            confidence: high
            notes:
              - The upstream installation requirements identify Windows Server 2022 LTSC amd64, OS build 20348.169 and subsequent non-major releases, as tested.
              - Windows nodes are workers only; server nodes must run Linux, and Windows workers require Calico or Flannel.
            sources:
              - *rke2_upstream_requirements_source
            lastVerified: 2026-09-16
            basis: tested
          windows-cni:
            ranges:
              - calico
              - flannel
            relationship: Windows worker network plugin
            confidence: high
            notes:
              - The upstream requirements require Calico or Flannel for Windows workers; control-plane nodes must run Linux.
            sources:
              - *rke2_upstream_requirements_source
            lastVerified: 2026-09-16
