x-kubernetes-version-skew-source: &kubernetes_version_skew_source
  title: Kubernetes Version Skew Policy
  url: https://kubernetes.io/releases/version-skew-policy/
  accessedAt: '2026-09-11'

projects:
  kubernetes-version-skew:
    name: Kubernetes Version Skew
    categories:
      - Orchestration
      - Kubernetes
    website: https://kubernetes.io/
    description: Kubernetes component version skew policy for API servers, nodes, control plane components, and kubectl.
    versions:
      '1.37':
        dependencies:
          kube-apiserver-ha-peer:
            ranges:
              - '>=1.36 <1.38'
            relationship: control plane peer
            confidence: high
            notes:
              - Kubernetes allows kube-apiserver instances in an HA cluster to differ by at most one minor version. This range includes released peer versions both older and newer than the requested API server.
            sources:
              - *kubernetes_version_skew_source
            lastVerified: '2026-09-11'
          kubelet:
            ranges:
              - '>=1.34 <1.38'
            relationship: node agent
            confidence: high
            notes:
              - Kubelet must not be newer than kube-apiserver and may be up to three minor versions older.
              - In HA clusters, this component must satisfy the skew policy for every API server it communicates with; mixed API server versions narrow the allowed range.
            sources:
              - *kubernetes_version_skew_source
            lastVerified: '2026-09-11'
          kube-proxy:
            ranges:
              - '>=1.34 <1.38'
            relationship: node networking
            confidence: high
            notes:
              - kube-proxy must not be newer than kube-apiserver and may be up to three minor versions older.
              - In HA clusters, this component must satisfy the skew policy for every API server it communicates with; mixed API server versions narrow the allowed range.
            sources:
              - *kubernetes_version_skew_source
            lastVerified: '2026-09-11'
          kube-controller-manager:
            ranges:
              - '>=1.36 <1.38'
            relationship: control plane component
            confidence: high
            notes:
              - kube-controller-manager is expected to match kube-apiserver but may be up to one minor version older.
              - In HA clusters, this component must satisfy the skew policy for every API server it communicates with; mixed API server versions narrow the allowed range.
            sources:
              - *kubernetes_version_skew_source
            lastVerified: '2026-09-11'
          kube-scheduler:
            ranges:
              - '>=1.36 <1.38'
            relationship: control plane component
            confidence: high
            notes:
              - kube-scheduler is expected to match kube-apiserver but may be up to one minor version older.
              - In HA clusters, this component must satisfy the skew policy for every API server it communicates with; mixed API server versions narrow the allowed range.
            sources:
              - *kubernetes_version_skew_source
            lastVerified: '2026-09-11'
          cloud-controller-manager:
            ranges:
              - '>=1.36 <1.38'
            relationship: control plane component
            confidence: high
            notes:
              - cloud-controller-manager is expected to match kube-apiserver but may be up to one minor version older.
              - In HA clusters, this component must satisfy the skew policy for every API server it communicates with; mixed API server versions narrow the allowed range.
            sources:
              - *kubernetes_version_skew_source
            lastVerified: '2026-09-11'
          kubectl:
            ranges:
              - '>=1.36 <1.38'
            relationship: client
            confidence: high
            notes:
              - kubectl is supported within one minor version older or newer than kube-apiserver.
              - In HA clusters, this component must satisfy the skew policy for every API server it communicates with; mixed API server versions narrow the allowed range.
              - The policy permits a client one minor version newer, but Kubernetes 1.38 is not yet a released compatibility target.
            sources:
              - *kubernetes_version_skew_source
            lastVerified: '2026-09-11'
