projects:
  jira-data-center:
    name: Jira Data Center
    categories:
      - Atlassian
      - Issue Tracking
      - Project Management
      - Java
    website: https://www.atlassian.com/software/jira
    description: Jira Data Center compatibility for Java runtimes and supported database platforms.
    versions:
      '11.3':
        dependencies:
          java:
            ranges:
              - '>=21 <22'
            relationship: runtime
            confidence: high
            notes:
              - Jira Data Center 11.3 supported platforms list Java 21 runtime level for Oracle JRE/JDK and Eclipse Temurin.
            sources:
              - *jira_113_supported_platforms_source
            lastVerified: '2026-07-09'
          postgresql:
            ranges:
              - '>=16 <18'
            relationship: database
            confidence: high
            notes:
              - Jira Data Center 11.3 supported platforms list PostgreSQL 16 and 17.
            sources:
              - *jira_113_supported_platforms_source
            lastVerified: '2026-07-09'
          amazon-aurora-postgresql:
            ranges:
              - '>=16 <18'
            relationship: database
            confidence: high
            notes:
              - Jira Data Center 11.3 supported platforms list Amazon Aurora PostgreSQL 16 and 17.
              - Atlassian notes that Amazon Aurora support is Data Center only and only for a PostgreSQL-compatible clustered database with one writer.
            sources:
              - *jira_113_supported_platforms_source
            lastVerified: '2026-07-09'
          mysql:
            ranges:
              - '>=8.4 <8.5'
            relationship: database
            confidence: high
            notes:
              - Jira Data Center 11.3 supported platforms list MySQL 8.4.
              - Atlassian notes that Jira will not work on MariaDB or PerconaDB.
            sources:
              - *jira_113_supported_platforms_source
            lastVerified: '2026-07-09'
          oracle:
            ranges:
              - '>=19 <20'
              - '19c'
              - '>=23 <24'
              - '23ai'
            relationship: database
            confidence: high
            notes:
              - Jira Data Center 11.3 supported platforms list Oracle 23ai as supported and Oracle 19c as deprecated.
              - Atlassian notes that Jira will not work on Oracle Database Express Editions or Oracle Advanced Compression Option.
            sources:
              - *jira_113_supported_platforms_source
            lastVerified: '2026-07-09'
          microsoft-sql-server:
            ranges:
              - '>=2019 <2020'
              - '>=2022 <2023'
            relationship: database
            confidence: high
            notes:
              - Jira Data Center 11.3 supported platforms list SQL Server 2022 as supported and SQL Server 2019 as deprecated.
              - Azure SQL is also listed as supported but is not modeled here because it does not have a product version in the Atlassian matrix.
            sources:
              - *jira_113_supported_platforms_source
            lastVerified: '2026-07-09'
