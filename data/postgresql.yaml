projects:
  postgresql:
    name: PostgreSQL
    categories:
      - Databases
      - Relational Database
    website: https://www.postgresql.org/
    description: PostgreSQL compatibility for popular independently versioned extensions.
    versions:
      '18':
        dependencies:
          postgis:
            ranges:
              - '3.6'
            relationship: extension
            confidence: high
            notes:
              - The PostGIS 3.6 release line supports PostgreSQL 12 through 18.
            sources:
              - *postgis_release_source
              - *postgis_support_source
            lastVerified: '2026-09-11'
          pgvector:
            ranges:
              - '>=0.8.1 <0.9'
            relationship: extension
            confidence: high
            notes:
              - PostgreSQL 18 support was introduced in pgvector 0.8.1; 0.8.0 does not include that support.
            sources:
              - title: pgvector 0.8.6 changelog - PostgreSQL 18 support added in 0.8.1
                url: https://github.com/pgvector/pgvector/blob/v0.8.6/CHANGELOG.md
                accessedAt: 2026-09-11
              - title: pgvector 0.8.6 installation
                url: https://github.com/pgvector/pgvector/blob/v0.8.6/README.md
                accessedAt: 2026-09-11
            lastVerified: '2026-09-11'
          timescaledb:
            ranges:
              - '>=2.23 <2.31'
            relationship: extension
            confidence: high
            notes:
              - TimescaleDB 2.23 introduced PostgreSQL 18 support alongside PostgreSQL 16 and 17, and the 2.30 release line continues to support all three PostgreSQL majors.
            sources:
              - *timescaledb_223_support_source
              - *timescaledb_230_support_source
            lastVerified: '2026-09-11'
          pg-cron:
            ranges:
              - '>=1.6.6 <1.7'
            relationship: extension
            confidence: high
            notes:
              - pg_cron 1.6.6 introduced PostgreSQL 18 compatibility in the 1.6 release line.
            sources:
              - title: pg_cron 1.6.6 release
                url: https://github.com/citusdata/pg_cron/releases/tag/v1.6.6
                accessedAt: 2026-09-11
              - title: pg_cron 1.6.8 installation
                url: https://github.com/citusdata/pg_cron/blob/v1.6.8/README.md
                accessedAt: 2026-09-11
            lastVerified: '2026-09-11'
