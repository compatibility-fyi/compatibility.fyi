projects:
  postgresql:
    name: PostgreSQL
    categories:
      - Databases
      - Relational Database
    website: https://www.postgresql.org/
    description: PostgreSQL compatibility for popular independently versioned extensions.
    versions:
      '18':
        dependencies:
          postgis:
            ranges:
              - '3.6'
            relationship: extension
            confidence: high
            notes:
              - The PostGIS 3.6 release line supports PostgreSQL 12 through 18.
            sources:
              - *postgis_release_source
              - *postgis_support_source
            lastVerified: '2026-07-31'
          pgvector:
            ranges:
              - '0.8'
            relationship: extension
            confidence: high
            notes:
              - The pgvector 0.8 release line documents support for PostgreSQL 13 and newer.
            sources:
              - *pgvector_080_support_source
              - *pgvector_086_support_source
            lastVerified: '2026-07-31'
          timescaledb:
            ranges:
              - '>=2.23 <2.30'
            relationship: extension
            confidence: high
            notes:
              - TimescaleDB 2.23 introduced PostgreSQL 18 support alongside PostgreSQL 16 and 17, and the 2.29 release line continues to support all three PostgreSQL majors.
