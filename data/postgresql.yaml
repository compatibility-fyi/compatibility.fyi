projects:
  postgresql:
    name: PostgreSQL
    categories:
      - Databases
      - Relational Database
    website: https://www.postgresql.org/
    description: PostgreSQL compatibility for popular independently versioned extensions.
    versions:
      '19':
        dependencies:
          postgis:
            ranges:
              - '3.7'
            relationship: extension
            confidence: high
            notes:
              - PostGIS 3.7 supports PostgreSQL 14 through 19. PostgreSQL 19 became generally available on November 19, 2026.
              - Other extension compatibility with PostgreSQL 19 is not inferred from older PostgreSQL support.
            sources:
              - title: PostGIS 3.7.0 release and PostgreSQL requirements
                url: https://postgis.net/2026/10/PostGIS-3.7.0/
                accessedAt: 2026-11-23
              - title: PostgreSQL 19 general availability announcement
                url: https://www.postgresql.org/about/news/postgresql-19-released-3449/
                accessedAt: 2026-11-23
            lastVerified: 2026-11-23
      '>=18.7 <19':
        dependencies:
          postgis:
            ranges:
              - '3.6'
              - '3.7'
            relationship: extension
            confidence: high
            notes:
              - The PostGIS 3.6 release line supports PostgreSQL 12 through 18; PostGIS 3.7 supports PostgreSQL 14 through 19.
            sources:
              - *postgis_release_source
              - *postgis_support_source
              - *postgis_37_release_source
            lastVerified: '2026-11-23'
          pgvector-linux-macos:
            ranges:
              - '>=0.8.1 <0.9'
            relationship: extension on Linux and macOS
            confidence: high
            notes:
              - PostgreSQL 18 support was introduced in pgvector 0.8.1; 0.8.0 does not include that support. This dependency key covers Linux and macOS; Windows support is not modeled.
            sources:
              - title: pgvector 0.8.7 changelog - PostgreSQL 18 support added in 0.8.1
                url: https://github.com/pgvector/pgvector/blob/v0.8.7/CHANGELOG.md
                accessedAt: 2026-11-23
              - title: pgvector 0.8.7 installation
                url: https://github.com/pgvector/pgvector/blob/v0.8.7/README.md
                accessedAt: 2026-11-23
            lastVerified: '2026-11-23'
          timescaledb:
            ranges:
              - '>=2.32.1 <2.33'
            relationship: extension
            confidence: high
            notes:
              - PostgreSQL 18.7 and later in the 18 release line require TimescaleDB 2.32.1 or later in the verified 2.32 line.
              - TimescaleDB 2.32.1 release notes document that background scheduler jobs fail with earlier TimescaleDB patches on PostgreSQL 18.7, 17.12, and 16.16 and later patches. Older TimescaleDB versions are intentionally outside this supported range.
            sources:
              - *timescaledb_223_support_source
              - *timescaledb_2321_support_source
              - *timescaledb_232_release_source
              - *timescaledb_2321_release_source
            lastVerified: '2026-11-23'
          pg-cron:
            ranges:
              - '>=1.6.6 <1.7'
            relationship: extension
            confidence: high
            notes:
              - pg_cron 1.6.6 introduced PostgreSQL 18 compatibility in the 1.6 release line.
            sources:
              - title: pg_cron 1.6.6 release
                url: https://github.com/citusdata/pg_cron/releases/tag/v1.6.6
                accessedAt: 2026-11-23
              - title: pg_cron 1.6.8 installation
                url: https://github.com/citusdata/pg_cron/blob/v1.6.8/README.md
                accessedAt: 2026-11-23
            lastVerified: '2026-11-23'
