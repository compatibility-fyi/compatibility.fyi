projects:
  red-hat-advanced-cluster-management:
    name: Red Hat Advanced Cluster Management for Kubernetes
    categories:
      - Cluster Management
      - Kubernetes
      - OpenShift
    website: https://www.redhat.com/en/technologies/management/advanced-cluster-management
    description: Red Hat Advanced Cluster Management compatibility for bundled MCE and hosted control planes.
    versions:
      '2.17':
        dependencies:
          multicluster-engine:
            ranges:
              - '2.17'
            relationship: bundled
            confidence: high
            notes:
              - RHACM 2.17 is released with MCE 2.17 for cluster management.
              - Red Hat notes MCE 2.11 was the immediate previous release and MCE 2.17 aligns the MCE version with RHACM 2.17.
            sources:
              - *rhacm_217_source
              - *mce_217_source
            lastVerified: '2026-07-08'
          openshift-management-cluster:
            ranges:
              - '>=4.20 <4.23'
            relationship: hub runtime
            confidence: high
            notes:
              - RHACM and MCE 2.17 list OpenShift 4.20, 4.21, and 4.22 as supported hub cluster versions.
            sources:
              - *rhacm_217_source
              - *mce_217_source
            lastVerified: '2026-07-08'
          openshift-hosted-cluster:
            ranges:
              - '>=4.20 <4.23'
            relationship: hosted control planes
            confidence: high
            notes:
              - RHACM and MCE 2.17 list hosted control planes for OpenShift 4.20 through 4.22 on OpenShift Virtualization, AWS, bare metal, non-bare-metal agent machines, IBM Power, and IBM Z.
