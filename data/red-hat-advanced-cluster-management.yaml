projects:
  red-hat-advanced-cluster-management:
    name: Red Hat Advanced Cluster Management for Kubernetes
    categories:
      - Cluster Management
      - Kubernetes
      - OpenShift
    website: https://www.redhat.com/en/technologies/management/advanced-cluster-management
    description: Red Hat Advanced Cluster Management compatibility for bundled MCE and hosted control planes.
    versions:
      '2.17':
        dependencies:
          multicluster-engine:
            ranges:
              - '2.17'
            relationship: bundled
            confidence: high
            notes:
              - The RHACM 2.17 operator installs the multicluster-engine package from its stable-2.17 channel.
            sources:
              - title: RHACM 2.17 operator MCE subscription channel
                url: https://github.com/stolostron/multiclusterhub-operator/blob/8cd81252a1b2e3375878bb8b24aa9c2307c36ee8/pkg/multiclusterengine/multiclusterengine.go
                accessedAt: 2026-09-11
              - title: RHACM operator component version 2.17.0
                url: https://github.com/stolostron/multiclusterhub-operator/blob/8cd81252a1b2e3375878bb8b24aa9c2307c36ee8/COMPONENT_VERSION
                accessedAt: 2026-09-11
            lastVerified: '2026-09-11'
            basis: bundled
          openshift-management-cluster:
            ranges:
              - '>=4.20 <4.23'
            relationship: hub runtime
            confidence: high
            notes:
              - MCE 2.17 supports hosted-control-plane management clusters running OpenShift 4.20 through 4.22.
              - Single-node OpenShift is not supported as a hosted-control-plane management cluster.
            sources:
              - title: OpenShift 4.22 hosted control planes support matrices
                url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.22/html/hosted_control_planes/preparing-to-deploy-hosted-control-planes
                accessedAt: 2026-09-11
              - title: Red Hat OpenShift Operator Life Cycles - RHACM and MCE
                url: https://access.redhat.com/support/policy/updates/openshift_operators
                accessedAt: 2026-09-11
            lastVerified: '2026-09-11'
          openshift-hosted-cluster:
            ranges:
              - '>=4.20 <4.23'
            relationship: hosted control planes
            confidence: high
            notes:
              - MCE 2.17 supports OpenShift 4.20 through 4.22 hosted clusters on AWS, bare metal, OpenShift Virtualization, IBM Power, and IBM Z, subject to the documented architecture combinations.
              - Bare-metal ARM64 workers and OpenShift Virtualization s390x clusters have narrower version ranges, modeled separately. Azure, non-bare-metal agent machines, and RHOSP are Technology Preview and are excluded.
            sources:
              - title: OpenShift 4.22 hosted control planes support matrices
                url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.22/html/hosted_control_planes/preparing-to-deploy-hosted-control-planes
                accessedAt: 2026-09-11
            lastVerified: '2026-09-11'
          openshift-hosted-cluster-bare-metal-arm64:
            ranges:
              - '>=4.21 <4.23'
            relationship: hosted control planes
            confidence: high
            notes:
              - Bare-metal hosted clusters with x86_64 control planes and ARM64 workers require OpenShift 4.21 or 4.22.
            sources:
              - title: OpenShift 4.22 hosted control planes support matrices
                url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.22/html/hosted_control_planes/preparing-to-deploy-hosted-control-planes
                accessedAt: 2026-09-11
            lastVerified: 2026-09-11
          openshift-hosted-cluster-virtualization-s390x:
            ranges:
              - '4.22'
            relationship: hosted control planes
            confidence: high
            notes:
              - OpenShift Virtualization hosted clusters with s390x control planes and s390x workers require OpenShift 4.22.
            sources:
              - title: OpenShift 4.22 hosted control planes support matrices
                url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.22/html/hosted_control_planes/preparing-to-deploy-hosted-control-planes
                accessedAt: 2026-09-11
            lastVerified: 2026-09-11
      '2.16':
        dependencies:
          multicluster-engine:
            ranges:
              - '2.11'
            relationship: bundled
            confidence: high
            notes:
              - RHACM 2.16 is released with MCE 2.11 for cluster management.
            sources:
              - *rhacm_216_source
              - *mce_211_source
            lastVerified: '2026-09-11'
            basis: bundled
          openshift-management-cluster:
            ranges:
              - '>=4.19 <4.23'
            relationship: hub runtime
            confidence: high
            notes:
              - RHACM 2.16 lists OpenShift 4.19 through 4.22 as supported hub and managed cluster versions.
            sources:
              - *rhacm_216_source
            lastVerified: '2026-09-11'
          openshift-hosted-cluster:
            ranges:
              - '>=4.19 <4.22'
            relationship: hosted control planes
            confidence: high
            notes:
              - Hosted control planes support for RHACM 2.16 follows MCE 2.11 and its bundled HyperShift Operator.
            sources:
              - *mce_211_source
              - *rhacm_216_source
            lastVerified: '2026-09-11'
      '2.15':
        dependencies:
          multicluster-engine:
            ranges:
              - '2.10'
            relationship: bundled
            confidence: high
            notes:
              - RHACM 2.15 is released with MCE 2.10 for cluster management.
            sources:
              - *rhacm_215_source
              - *mce_210_source
            lastVerified: '2026-09-11'
            basis: bundled
          openshift-management-cluster:
            ranges:
              - '>=4.18 <4.22'
            relationship: hub runtime
            confidence: high
            notes:
              - MCE 2.10 lists OpenShift 4.18, 4.19, 4.20, and 4.21 as supported hub cluster versions.
            sources:
              - *mce_210_source
              - *rhacm_215_source
            lastVerified: '2026-09-11'
          openshift-hosted-cluster:
            ranges:
              - '>=4.18 <4.21'
            relationship: hosted control planes
            confidence: high
            notes:
              - Hosted control planes support for RHACM 2.15 follows MCE 2.10 and its bundled HyperShift Operator.
            sources:
              - *mce_210_source
              - *rhacm_215_source
            lastVerified: '2026-09-11'
      '2.14':
        dependencies:
          multicluster-engine:
            ranges:
              - '2.9'
            relationship: bundled
            confidence: high
            notes:
              - RHACM 2.14 is released with MCE 2.9 for cluster management.
            sources:
              - *rhacm_214_source
              - *mce_29_source
            lastVerified: '2026-09-11'
            basis: bundled
          openshift-management-cluster:
            ranges:
              - '>=4.17 <4.21'
            relationship: hub runtime
            confidence: high
            notes:
              - RHACM 2.14 lists OpenShift 4.17 through 4.20 as supported hub and managed cluster versions.
            sources:
              - *rhacm_214_source
            lastVerified: '2026-09-11'
          openshift-hosted-cluster:
            ranges:
              - '>=4.17 <4.20'
            relationship: hosted control planes
            confidence: high
            notes:
              - Hosted control planes support for RHACM 2.14 follows MCE 2.9 and its bundled HyperShift Operator.
            sources:
              - *mce_29_source
              - *rhacm_214_source
            lastVerified: '2026-09-11'
      '2.13':
        dependencies:
          multicluster-engine:
            ranges:
              - '2.8'
            relationship: bundled
            confidence: high
            notes:
              - RHACM 2.13 is released with MCE 2.8 for cluster management.
            sources:
              - *rhacm_213_source
              - *mce_28_source
            lastVerified: '2026-09-11'
            basis: bundled
          openshift-management-cluster:
            ranges:
              - '>=4.16 <4.20'
            relationship: hub runtime
            confidence: high
            notes:
              - MCE 2.8 lists OpenShift 4.16, 4.17, 4.18, and 4.19 as supported hub cluster versions.
            sources:
              - *mce_28_source
              - *rhacm_213_source
            lastVerified: '2026-09-11'
          openshift-hosted-cluster:
            ranges:
              - '>=4.16 <4.19'
            relationship: hosted control planes
            confidence: high
            notes:
              - Hosted control planes support for RHACM 2.13 follows MCE 2.8 and its bundled HyperShift Operator.
              - This range covers OpenShift Virtualization, AWS x86, and bare metal. AWS ARM64, IBM Power, and IBM Z have narrower platform-specific ranges.
            sources:
              - *mce_28_source
              - *rhacm_213_source
            lastVerified: '2026-09-11'
          openshift-hosted-cluster-aws-arm64:
            ranges:
              - '>=4.17 <4.19'
            relationship: hosted control plane on aws-arm64
            confidence: high
            notes:
              - MCE 2.8 supports hosted OpenShift 4.17 and 4.18 on AWS ARM64.
            sources:
              - *mce_28_source
              - *rhacm_213_source
            lastVerified: '2026-09-11'
          openshift-hosted-cluster-ibm-power:
            ranges:
              - '>=4.17 <4.19'
            relationship: hosted control plane on ibm-power
            confidence: high
            notes:
              - MCE 2.8 supports hosted OpenShift 4.17 and 4.18 on this platform. IBM Power and IBM Z support is for managed hosted clusters, not the hosting cluster.
            sources:
              - *mce_28_source
              - *rhacm_213_source
            lastVerified: '2026-09-11'
          openshift-hosted-cluster-ibm-z:
            ranges:
              - '>=4.17 <4.19'
            relationship: hosted control plane on ibm-z
            confidence: high
            notes:
              - MCE 2.8 supports hosted OpenShift 4.17 and 4.18 on this platform. IBM Power and IBM Z support is for managed hosted clusters, not the hosting cluster.
            sources:
              - *mce_28_source
              - *rhacm_213_source
            lastVerified: '2026-09-11'
