projects:
  sonarqube-server:
    name: SonarQube Server
    categories:
      - Code Quality
      - DevOps
      - Java
    website: https://www.sonarsource.com/products/sonarqube/
    description: SonarQube Server compatibility for Java runtimes, production databases, and Helm deployment platforms.
    versions:
      '2026.5':
        dependencies:
          java:
            ranges:
              - '21'
              - '25'
            relationship: server runtime
            confidence: high
            notes:
              - SonarQube Server 2026.5 ZIP installations support Java 21 or Java 25 and require a full JDK rather than only a JRE.
            sources:
              - *sonarqube_2026_5_host_source
            lastVerified: '2026-10-05'
          postgresql:
            ranges:
              - '>=15 <19'
            relationship: production database
            confidence: high
            notes:
              - SonarQube Server 2026.5 supports PostgreSQL 15 through 18.
            sources:
              - *sonarqube_2026_5_database_source
            lastVerified: '2026-10-05'
          microsoft-sql-server:
            ranges:
              - '>=14 <18'
            relationship: production database
            confidence: high
            notes:
              - SonarQube Server 2026.5 supports Microsoft SQL Server internal versions 14.0 through 17.0, corresponding to SQL Server 2017, 2019, 2022, and 2025.
            sources:
              - *sonarqube_2026_5_database_source
            lastVerified: '2026-10-05'
          oracle:
            ranges:
