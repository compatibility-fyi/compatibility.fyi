projects:
  sonarqube-server:
    name: SonarQube Server
    categories:
      - Code Quality
      - DevOps
      - Java
    website: https://www.sonarsource.com/products/sonarqube/
    description: SonarQube Server compatibility for Java runtimes, production databases, and Helm deployment platforms.
    versions:
      '2026.4':
        dependencies:
          java:
            ranges:
              - '21'
              - '25'
            relationship: server runtime
            confidence: high
            notes:
              - SonarQube Server 2026.4 supports Java 21 or Java 25 and requires a full JDK rather than only a JRE.
            sources:
              - *sonarqube_2026_4_host_source
            lastVerified: '2026-07-27'
          postgresql:
            ranges:
              - '>=14 <19'
            relationship: production database
            confidence: high
            notes:
              - SonarQube Server 2026.4 supports PostgreSQL 14 through 18.
            sources:
              - *sonarqube_2026_4_database_source
            lastVerified: '2026-07-27'
          microsoft-sql-server:
            ranges:
              - '>=14 <17'
            relationship: production database
            confidence: high
            notes:
              - SonarQube Server 2026.4 supports Microsoft SQL Server internal versions 14.0 through 16.0, corresponding to SQL Server 2017, 2019, and 2022.
            sources:
              - *sonarqube_2026_4_database_source
            lastVerified: '2026-07-27'
          oracle:
            ranges:
              - '19c'
              - '21c'
              - '23ai'
              - 'xe'
            relationship: production database
            confidence: high
            notes:
              - SonarQube Server 2026.4 supports Oracle 19c, 21c, 23ai, and XE editions.
