name: Link check

on:
  push:
    branches:
      - master
    paths:
      - 'data/*.yaml'
      - 'scripts/check-data-links.ts'
      - '.github/workflows/links.yml'
  pull_request:
    paths:
      - 'data/*.yaml'
      - 'scripts/check-data-links.ts'
      - '.github/workflows/links.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check YAML links
        run: npm run check:links
